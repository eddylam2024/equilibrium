[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "equilibrium"
version = "0.1.0"
description = "A quantitative portfolio-construction research terminal centred on the Black-Litterman model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
urls = { Homepage = "https://github.com/eddylam2024/equilibrium" }
authors = [{ name = "Edouard Lam" }]
keywords = ["black-litterman", "portfolio", "quant", "finance", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0.43",
    "matplotlib>=3.8",
]

[project.scripts]
equilibrium = "equilibrium.cli.main:run"
eq = "equilibrium.cli.main:run"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/equilibrium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
markers = ["live: requires network access to Yahoo Finance (deselected by default)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]  # math names like Sigma, P, Q; unicode math symbols

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
